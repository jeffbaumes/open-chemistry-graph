title = "Organization of the periodic table"
summary = "Read groups, periods and element families from the table."
unit = "periodic"
prerequisites = ["valence-electrons"]

[[interactive]]
kind = "periodic-table"
title = "The first four periods"
caption = "Tap an element to see its details."

[[exercise]]
type = "choice"
prompt = "Elements in the same group have the same:"
options = ["number of protons", "number of energy levels", "number of valence electrons", "atomic mass"]
answer = 2

[[exercise]]
type = "choice"
prompt = "Which element is a halogen?"
options = ["Sodium", "Argon", "Fluorine", "Calcium"]
answer = 2

[[exercise]]
type = "choice"
prompt = "In which period is an element with the configuration 1s^2 2s^2 2p^6 3s^2 3p^1?"
options = ["Period 1", "Period 2", "Period 3", "Period 13"]
answer = 2

[[exercise]]
type = "choice"
prompt = "Which describes most metals?"
options = ["Dull and brittle", "Shiny and good conductors", "Gases at room temperature", "Gain electrons easily"]
answer = 1

[[exercise]]
type = "text"
prompt = "What is the name of the group 18 elements?"
answer = "noble gases"
accept = ["the noble gases", "noble gas"]

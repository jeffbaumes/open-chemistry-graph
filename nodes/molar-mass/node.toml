title = "Molar mass"
summary = "Find the mass of one mole of a compound from its formula."
prerequisites = ["chemical-formulas", "the-mole"]

[[exercise]]
type = "numeric"
prompt = "What is the molar mass of water, H2O?"
answer = 18.015
unit = "g/mol"
derive = { kind = "molar_mass", formula = "H2O" }

[[exercise]]

title = "Significant figures"
summary = "Count the digits in a measurement that carry real information."
unit = "matter"
prerequisites = []

[[interactive]]
kind = "sig-figs"
title = "Significant figure counter"
caption = "Type any number to see which digits are significant."

[[exercise]]
type = "numeric"
prompt = "How many significant figures are in 0.00420?"
answer = 3
unit = "significant figures"

[[exercise]]
type = "numeric"
prompt = "How many significant figures are in 1002?"
answer = 4
unit = "significant figures"

[[exercise]]
type = "choice"
prompt = "12.11 + 18.0 + 1.013 shows as 31.123 on a calculator. How should it be reported?"
options = ["31.123", "31.12", "31.1", "31"]
answer = 2

[[exercise]]
type = "choice"
prompt = "2.5 × 3.42 shows as 8.55 on a calculator. How should it be reported?"
options = ["8.55", "8.6", "8.550", "9"]
answer = 1

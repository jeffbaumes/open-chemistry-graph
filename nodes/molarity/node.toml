title = "Molarity"
summary = "Measure the concentration of a solution in moles per liter."
unit = "solutions"
prerequisites = ["solutions-and-solubility", "mole-mass-conversions"]

[[interactive]]
kind = "molarity"
title = "Concentration"
caption = "Change the amount of solute and the volume of solution."

[[exercise]]
type = "numeric"
prompt = "What is the molarity of a solution with 3.0 mol of solute in 1.5 L of solution?"
answer = 2.0
unit = "M"
derive = "3.0 / 1.5"

[[exercise]]
type = "numeric"
prompt = "How many moles of HCl are in 0.500 L of a 0.200 M solution?"
answer = 0.1
unit = "mol"
derive = "0.500 * 0.200"

[[exercise]]
type = "numeric"
prompt = "What is the molarity of 58.44 g of NaCl dissolved to make 2.00 L of solution?"
answer = 0.5
unit = "M"
derive = "58.44 / M('NaCl') / 2.00"

[[exercise]]
type = "numeric"
prompt = "What mass of NaOH is needed to make 250 mL of a 1.00 M solution?"
answer = 10.0
unit = "g"
derive = "0.250 * 1.00 * M('NaOH')"

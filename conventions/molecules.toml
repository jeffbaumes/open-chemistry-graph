# How to draw a molecule: each atom's symbol and its position, in units of one
# atom radius. List the central atom last so it is drawn on top.
# A formula with no entry here is drawn as a simple row of its atoms.

[layout]
H2 = [["H", -0.8, 0], ["H", 0.8, 0]]
O2 = [["O", -0.85, 0], ["O", 0.85, 0]]
N2 = [["N", -0.85, 0], ["N", 0.85, 0]]
Cl2 = [["Cl", -0.85, 0], ["Cl", 0.85, 0]]
HCl = [["H", -0.9, 0], ["Cl", 0.7, 0]]
CO = [["O", 0.85, 0], ["C", -0.85, 0]]
H2O = [["H", -1.25, 0.8], ["H", 1.25, 0.8], ["O", 0, -0.15]]
CO2 = [["O", -1.7, 0], ["O", 1.7, 0], ["C", 0, 0]]
NH3 = [["H", -1.3, 0.8], ["H", 1.3, 0.8], ["H", 0, 1.4], ["N", 0, -0.1]]
CH4 = [["H", -1.3, -0.8], ["H", 1.3, -0.8], ["H", -1.3, 0.8], ["H", 1.3, 0.8], ["C", 0, 0]]

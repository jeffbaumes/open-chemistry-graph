# The units of the course, in teaching order. Each node names one of these ids.
# Within a unit, lessons are ordered by their prerequisites. Where that leaves
# an odd order, a unit can list its lessons explicitly with `lessons = [...]`;
# any it leaves out follow the listed ones. A lesson may not be listed before
# one of its own prerequisites.

